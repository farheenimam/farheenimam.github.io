<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contribution Trail</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050509;
    --pink: #FF2DAA;
    --bright: #FF4FC3;
    --violet: #A82CFF;
    --lavender: #E7D9FF;
    --muted: #AAA0C8;
    --dim: #54204F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--lavender); font-family: 'JetBrains Mono', monospace; }
  body { padding: 16px; min-height: 100vh; position: relative; overflow-x: hidden; }

  /* faint scanlines over everything */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 3px);
    pointer-events: none;
  }

  .wrap { max-width: 900px; margin: 0 auto; }

  .title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(11px, 2.2vw, 16px);
    color: var(--pink);
    text-shadow: 0 0 8px rgba(255,45,170,0.6);
    text-align: center;
    letter-spacing: 1px;
    line-height: 1.6;
  }
  .prompt {
    margin-top: 14px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
  .prompt b { color: var(--bright); font-weight: 400; }
  .caret { display: inline-block; width: 7px; height: 13px; background: var(--pink); vertical-align: -2px; animation: blink 1s steps(1) infinite; box-shadow: 0 0 6px var(--pink); }
  @keyframes blink { 50% { opacity: 0; } }

  /* angular neon card */
  .card {
    position: relative;
    margin: 26px auto 0;
    padding: 2px;
    background: linear-gradient(135deg, var(--pink), var(--violet) 50%, var(--pink));
    clip-path: polygon(18px 0, calc(100% - 18px) 0, 100% 18px, 100% calc(100% - 18px), calc(100% - 18px) 100%, 18px 100%, 0 calc(100% - 18px), 0 18px);
    filter: drop-shadow(0 0 12px rgba(255,45,170,0.35));
  }
  .card-inner {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    background: #07060d;
    clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 16px, 100% calc(100% - 16px), calc(100% - 16px) 100%, 16px 100%, 0 calc(100% - 16px), 0 16px);
    padding: 30px 20px;
    gap: 10px;
  }

  .stat { text-align: center; padding: 0 8px; }
  .stat .label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .stat .value {
    font-size: clamp(26px, 4.4vw, 40px);
    font-weight: 700;
    color: var(--lavender);
    text-shadow: 0 0 10px rgba(231,217,255,0.25);
    margin: 8px 0 6px;
  }
  .stat .range { font-size: 11px; color: var(--muted); opacity: 0.8; }
  .stat .range::before { content: '// '; color: var(--violet); }

  /* the streak ring */
  .streak { text-align: center; position: relative; }
  .ring { position: relative; width: clamp(130px, 22vw, 170px); height: clamp(130px, 22vw, 170px); margin: 0 auto; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .ring .track { fill: none; stroke: rgba(168,44,255,0.15); stroke-width: 6; }
  .ring .arc {
    fill: none; stroke: url(#grad); stroke-width: 6; stroke-linecap: round;
    stroke-dasharray: 440; stroke-dashoffset: 440;
    filter: drop-shadow(0 0 6px rgba(255,45,170,0.8));
    animation: draw 2.2s ease-out forwards;
  }
  @keyframes draw { to { stroke-dashoffset: calc(440 - (440 * 73 / 365)); } }
  .ring .tick { stroke: var(--pink); stroke-width: 2; opacity: 0.6; }
  .ring-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .flame { font-size: 16px; animation: flicker 1.6s ease-in-out infinite; filter: drop-shadow(0 0 6px var(--pink)); }
  @keyframes flicker { 0%,100% { transform: scale(1) translateY(0); opacity: 1; } 50% { transform: scale(1.12) translateY(-2px); opacity: 0.85; } }
  .ring-num { font-size: clamp(30px, 5vw, 42px); font-weight: 700; color: var(--bright); text-shadow: 0 0 12px rgba(255,79,195,0.7); line-height: 1; }
  .ring-days { font-size: 10px; letter-spacing: 3px; color: var(--muted); margin-top: 4px; }

  .streak-label {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 700;
    color: var(--bright);
    letter-spacing: 1px;
    text-shadow: 0 0 6px rgba(255,45,170,0.5);
  }
  .streak-label::before { content: '> '; color: var(--violet); }

  .vdiv {
    position: absolute; top: 14%; bottom: 14%; width: 1px;
    background: linear-gradient(transparent, var(--pink), transparent);
    box-shadow: 0 0 6px var(--pink);
  }

  /* terminal footer */
  .footer {
    margin-top: 18px;
    font-size: 11px;
    color: var(--muted);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    padding: 0 6px;
  }
  .footer .ok { color: var(--bright); }

  /* narrow screens: stack the three readouts, keep the ring on top */
  @media (max-width: 620px) {
    .card-inner { grid-template-columns: 1fr; padding: 22px 16px; gap: 6px; }
    .streak { order: -1; }
    .vdiv { display: none; }
    .stat + .stat { border-top: 1px dashed var(--dim); padding-top: 14px; margin-top: 6px; }
    .streak + .stat { border-top: 1px dashed var(--dim); padding-top: 14px; margin-top: 6px; }
    .footer { flex-direction: column; align-items: center; text-align: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    .ring .arc { animation: none; stroke-dashoffset: calc(440 - (440 * 73 / 365)); }
    .flame, .caret { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="title">MEWTU CONTRIBUTION TRAIL</div>
  <div class="prompt"><b>$</b> git log --streak --since="2022-10-17"<span class="caret"></span></div>

  <div class="card">
    <div class="card-inner">

      <div class="stat">
        <div class="label">Total Contributions</div>
        <div class="value" data-stat="totalContributions">4,504</div>
        <div class="range" data-stat="totalRange">Oct 17, 2022 - Present</div>
      </div>

      <div class="streak">
        <div class="vdiv" style="left:-18px"></div>
        <div class="vdiv" style="right:-18px"></div>
        <div class="ring">
          <svg viewBox="0 0 160 160">
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#A82CFF"/>
                <stop offset="100%" stop-color="#FF2DAA"/>
              </linearGradient>
            </defs>
            <circle class="track" cx="80" cy="80" r="70"/>
            <circle class="arc" cx="80" cy="80" r="70"/>
          </svg>
          <div class="ring-center">
            <div class="flame">&#x1F525;</div>
            <div class="ring-num" data-stat="currentStreak">73</div>
            <div class="ring-days">DAYS</div>
          </div>
        </div>
        <div class="streak-label">Current Streak</div>
        <div class="range" style="font-size:11px;color:var(--muted);margin-top:4px" data-stat="currentRange">Aug 19 - Oct 30</div>
      </div>

      <div class="stat">
        <div class="label">Longest Streak</div>
        <div class="value" data-stat="longestStreak">73</div>
        <div class="range" data-stat="longestRange">Aug 19 - Oct 30</div>
      </div>

    </div>
  </div>

  <div class="footer">
    <span>status: <span class="ok">streak active</span></span>
    <span>ring = <span data-stat="currentStreak">73</span> / 365 days</span>
  </div>

</div>
<script src="live-stats.js"></script>
</body>
</html>
